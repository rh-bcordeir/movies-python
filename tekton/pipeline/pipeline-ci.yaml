apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: movies-python-ci
  namespace: movies-ci
spec:
  description: "Clone → test → build image → push to Quay → update values-dev.yaml"
  params:
    - name: app-repo-url
      type: string
      default: "https://github.com/rh-bcordeir/movies-python.git"
    - name: app-repo-revision
      type: string
    - name: gitops-repo-url
      type: string
      default: "https://github.com/rh-bcordeir/movies-python-devops"
    - name: gitops-repo-revision
      type: string
      default: "develop"
    - name: image-tag
      type: string
      description: "Short SHA injected by the trigger."
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: URL
          value: $(params.app-repo-url)
        - name: REVISION
          value: $(params.app-repo-revision)

    - name: test
      runAfter: ["fetch-source"]
      taskRef:
        name: python-test
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build-image
      runAfter: ["test"]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: quay.io/rh-ee-bcordeir/movies-python:$(params.image-tag)
        - name: DOCKERFILE
          value: ./Containerfile 

    - name: update-gitops-dev
      runAfter: ["build-image"]
      taskRef:
        name: update-gitops
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: GITOPS_REPO_URL
          value: $(params.gitops-repo-url)
        - name: GITOPS_REPO_REVISION
          value: $(params.gitops-repo-revision)
        - name: VALUES_FILE
          value: "chart/values/values-dev.yaml"
        - name: IMAGE_REPOSITORY
          value: "quay.io/rh-ee-bcordeir/movies-python"
        - name: IMAGE_TAG
          value: $(params.image-tag)
        - name: GIT_USER_NAME
          value: "Tekton Pipeline"
        - name: GIT_USER_EMAIL
          value: "tekton@movies.local"