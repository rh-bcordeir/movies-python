---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: movies-ci-pipeline-triggers
rules:
  - apiGroups: ["triggers.tekton.dev"]
    resources:
      - clusterinterceptors
      - clustertriggerbindings
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: movies-ci-pipeline-triggers
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: movies-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: movies-ci-pipeline-triggers