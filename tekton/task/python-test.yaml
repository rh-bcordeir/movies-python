apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: python-test
  namespace: movies-ci
spec:
  workspaces:
    - name: source
  steps:
    - name: pytest
      image: registry.access.redhat.com/ubi9/python-314:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        python -m venv /tmp/venv && . /tmp/venv/bin/activate
        pip install --no-cache-dir -r requirements.txt pytest
        pytest -q
