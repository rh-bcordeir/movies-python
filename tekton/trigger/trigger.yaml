---
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  namespace: movies-ci
type: Opaque
stringData:
  secretToken: "secret123"

---
# ── Bindings ─────────────────────────────────────────────────────────────────

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
  namespace: movies-ci
spec:
  params:
    - name: git-revision
      value: $(body.head_commit.id)
    - name: git-repo-url
      value: $(body.repository.clone_url)
    - name: short-sha
      value: $(extensions.short_sha)

---
# ── TriggerTemplate: CI (develop → dev) ──────────────────────────────────────

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: movies-python-ci-template
  namespace: movies-ci
spec:
  params:
    - name: git-revision
    - name: git-repo-url
    - name: short-sha
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: movies-python-ci-
        namespace: movies-ci
      spec:
        pipelineRef:
          name: movies-python-ci
        taskRunTemplate:
          serviceAccountName: pipeline
        params:
          - name: app-repo-url
            value: $(tt.params.git-repo-url)
          - name: app-repo-revision
            value: $(tt.params.git-revision)
          - name: image-tag
            value: $(tt.params.short-sha)
        workspaces:
          - name: shared-workspace
            persistentVolumeClaim:
              claimName: pipeline-workspace

---
# ── EventListener ─────────────────────────────────────────────────────────────
# Three triggers share the same webhook URL but are filtered by branch via CEL.

apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: movies-python-listener
  namespace: movies-ci
spec:
  serviceAccountName: pipeline
  triggers:
    - name: develop-push
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        - ref:
            name: cel
          params:
            - name: filter
              value: "body.ref == 'refs/heads/develop'"
            - name: overlays
              value:
                - key: short_sha
                  expression: "body.head_commit.id.truncate(7)"
      bindings:
        - ref: github-push-binding
      template:
        ref: movies-python-ci-template

    - name: release-push
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        - ref:
            name: cel
          params:
            - name: filter
              value: "body.ref == 'refs/heads/release'"
            - name: overlays
              value:
                - key: short_sha
                  expression: "body.head_commit.id.truncate(7)"
      bindings:
        - ref: github-push-binding
      template:
        ref: movies-python-promote-hml-template

    - name: main-push
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        - ref:
            name: cel
          params:
            - name: filter
              value: "body.ref == 'refs/heads/main'"
            - name: overlays
              value:
                - key: short_sha
                  expression: "body.head_commit.id.truncate(7)"
      bindings:
        - ref: github-push-binding
      template:
        ref: movies-python-promote-prd-template

---
# ── Route (single webhook URL for all three triggers) ────────────────────────

apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: el-movies-python-listener
  namespace: movies-ci
spec:
  to:
    kind: Service
    name: el-movies-python-listener
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
